name: CI/CD

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
    CLOUDFLARE_PAGES_PROJECT: zalgo-official-com
jobs:
    cicd:
        runs-on: ubuntu-latest
        concurrency:
            group: concurrency
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Set up node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - name: Set up cache
              uses: actions/cache@v6
              with:
                  path: ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/post.md') }}
                  restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            - name: Install packages
              run: npm ci
            - name: Lint code
              uses: reviewdog/action-eslint@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-pr-review
            - name: Build
              run: npm run build
              env:
                  AMAZON_ASSOCIATE_PARTNER_TAG: ${{ secrets.AMAZON_ASSOCIATE_PARTNER_TAG }}
                  RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
                  RAKUTEN_API_ACCESS_KEY: ${{ secrets.RAKUTEN_API_ACCESS_KEY }}
                  RAKUTEN_API_APPLICATION_ID: ${{ secrets.RAKUTEN_API_APPLICATION_ID }}
                  VALUE_COMMERCE_PID: ${{ secrets.VALUE_COMMERCE_PID }}
                  VALUE_COMMERCE_SID: ${{ secrets.VALUE_COMMERCE_SID }}
                  YAHOO_API_APP_ID: ${{ secrets.YAHOO_API_APP_ID }}
            - name: Deploy to Cloudflare Pages
              id: deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  # Creates the Pages project on the first run; later runs
                  # fail the create harmlessly and go straight to deploy.
                  preCommands: npx wrangler pages project create ${{ env.CLOUDFLARE_PAGES_PROJECT }} --production-branch=main || true
                  # PRs deploy to a preview alias; pushes to main go live.
                  command: pages deploy out --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
            - name: Comment preview URL on PR
              if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != '' }}
              uses: actions/github-script@v9
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
              with:
                  script: |
                      const url = process.env.PREVIEW_URL;
                      const marker = '<!-- cloudflare-preview-url -->';
                      const body = `${marker}\n🚀 **プレビューデプロイ**: ${url}\n\n<sub>このコメントはコミットごとに更新されます。</sub>`;
                      const {owner, repo} = context.repo;
                      const issue_number = context.issue.number;
                      const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
                      const existing = comments.find((c) => c.body && c.body.includes(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
                      } else {
                          await github.rest.issues.createComment({owner, repo, issue_number, body});
                      }
