name: CI/CD

# Deployment is handled by Cloudflare Pages' own GitHub integration (it builds
# every push and posts preview URLs on PRs); this workflow only lints and
# checks that the static export builds.

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    cicd:
        runs-on: ubuntu-latest
        concurrency:
            group: concurrency
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Set up node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - name: Set up cache
              uses: actions/cache@v6
              with:
                  path: ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/post.md') }}
                  restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            - name: Install packages
              run: npm ci
            - name: Lint code
              uses: reviewdog/action-eslint@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-pr-review
            - name: Build
              run: npm run build
              env:
                  AMAZON_ASSOCIATE_PARTNER_TAG: ${{ secrets.AMAZON_ASSOCIATE_PARTNER_TAG }}
                  RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
                  RAKUTEN_API_ACCESS_KEY: ${{ secrets.RAKUTEN_API_ACCESS_KEY }}
                  RAKUTEN_API_APPLICATION_ID: ${{ secrets.RAKUTEN_API_APPLICATION_ID }}
                  VALUE_COMMERCE_PID: ${{ secrets.VALUE_COMMERCE_PID }}
                  VALUE_COMMERCE_SID: ${{ secrets.VALUE_COMMERCE_SID }}
                  YAHOO_API_APP_ID: ${{ secrets.YAHOO_API_APP_ID }}
